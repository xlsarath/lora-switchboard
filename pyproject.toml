[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lora-switchboard"
dynamic = ["version"]
description = "Safe LoRA adapter rollouts for vLLM: versioned registry, smoke-tested deploys, alias routing and instant rollback."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sarath Makkena" }]
keywords = ["vllm", "lora", "llm", "mlops", "inference", "deployment", "rollback", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Software Distribution",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyYAML>=6.0",
  "jsonschema>=4.21",
  "prometheus-client>=0.20",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
lora-switchboard = "lora_switchboard.cli:main"

[project.urls]
Homepage = "https://github.com/xlsarath/lora-switchboard"
Issues = "https://github.com/xlsarath/lora-switchboard/issues"
Changelog = "https://github.com/xlsarath/lora-switchboard/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/lora_switchboard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lora_switchboard"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "RET", "LOG"]
ignore = ["B008"]  # FastAPI/Typer use call expressions in defaults by design

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
