# Smoke tests for the `support-bot` adapter.
# Every test must pass before a new version receives traffic.
defaults:
  params: {temperature: 0, max_tokens: 128}   # merged into every request
  timeout_s: 30                               # per-request timeout
  max_latency_ms: 3000                        # default latency budget per test
concurrency: 4                                # tests run in parallel

tests:
  - name: answers order questions
    messages:
      - {role: system, content: "You are a friendly support agent for an online store."}
      - {role: user, content: "Where is my order? It has been a week."}
    expect:
      contains: ["help"]              # case-insensitive unless case_sensitive: true
      not_contains: ["as an AI", "lorem"]

  - name: classifies intent as JSON
    messages:
      - {role: user, content: "Reply with JSON only. Classify: 'I want my money back'"}
    expect:
      json_schema:
        type: object
        required: [intent, confidence]
        properties:
          intent: {type: string, enum: [refund, shipping, other]}
          confidence: {type: number, minimum: 0, maximum: 1}

  - name: stays fast
    prompt: "Say hello."
    params: {max_tokens: 16}
    expect:
      regex: "(?i)hello|help"
      max_latency_ms: 1500
