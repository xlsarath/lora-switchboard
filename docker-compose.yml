# Quickstart: switchboard + a fake vLLM (no GPU needed).
#
#   docker compose up -d --build
#   ./examples/demo.sh
#
# To use a real vLLM on a GPU host, comment out `fake-vllm`, uncomment `vllm`
# below and point LSB_VLLM_URL at it.

services:
  switchboard:
    build: .
    image: lora-switchboard:local
    ports:
      - "8000:8000"
    environment:
      LSB_VLLM_URL: http://fake-vllm:8001
      # LSB_VLLM_URL: http://vllm:8001
      LSB_DRAIN_DELAY_S: "5"
      LSB_KEEP_LOADED: "2"
      LSB_LOG_LEVEL: INFO
      # LSB_ADMIN_TOKEN: change-me   # protects /admin; the CLI reads LSB_ADMIN_TOKEN too
    volumes:
      - switchboard-data:/data
    depends_on:
      fake-vllm:
        condition: service_healthy

  fake-vllm:
    image: lora-switchboard:local
    entrypoint: ["lora-switchboard"]
    command: ["fake-vllm", "--host", "0.0.0.0", "--port", "8001", "--load-delay", "0.4"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # vllm:
